name: build-image
run-name: Build the shimboot disk image for all boards
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string
jobs:
  build:
    permissions:
      contents: write

    strategy: 
      matrix:
        board: [nissa]

    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: download repo
        uses: actions/checkout@v4
      
      - name: run build
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y
          sudo apt install wget -y
          wget https://b2.crosbreaker.dev/file/crosbreaker/ChromeOS/shims/raw-shims/nissa-raw.bin
          git clone https://github.com/kazuiton/nanoboot&&cd nanoboot&&mkdir -p root
          sudo ./build.sh image.bin raw-nissa.bin root 
      - name: upload img
        uses: actions/upload-artifact@v4
        with:
          name: shimboot_${{ matrix.board }}
          path: data/${{ matrix.board }}.bin
          compression-level: 7
  
      - name: create release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: data/${{ matrix.board }}.bin
